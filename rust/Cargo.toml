[package]
name = "rust_listener"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
eyre = "0.6.12"
dotenv = "0.15.0"
alloy = { version = "1.1.3", features = ["full"] }
tokio = { version = "1.48.0", features = ["full"] }
reqwest = "0.12.26"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
futures-util = "0.3"
async-trait = "0.1.89"
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
prost = "0.14.3"
prost-types = "0.14.3"
protoc-prebuilt = "0.3.0"

# logging
log = "0.4"
fern = { version = "0.7", features = ["colored"] }
chrono = "0.4.42"

[build-dependencies]
prost-build = "0.14.3"
